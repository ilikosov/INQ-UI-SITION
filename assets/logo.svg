<svg width="720" height="220" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="720" height="220" fill="#0f1115"/>

  <!-- Emblem -->
  <g transform="translate(110,40)">
    
    <!-- Vertical Line (Inquisition I) -->
    <rect x="45" y="0" width="10" height="140" fill="#c5a642"/>
    
    <!-- Horizontal Bar -->
    <rect x="0" y="55" width="100" height="10" fill="#c5a642"/>

    <!-- UI Core Highlight -->
    <text x="50" y="62"
          text-anchor="middle"
          dominant-baseline="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="28"
          font-weight="700"
          fill="#ff4d00">
      UI
    </text>

  </g>

  <!-- Brand Name -->
  <text x="250" y="125"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="700"
        fill="#e5e7eb"
        letter-spacing="2">
    INQ<tspan fill="#ff4d00">UI</tspan>SITION
  </text>

</svg>
